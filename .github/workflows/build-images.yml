# W6 — build the six container images for the demo box and publish them to GHCR.
#
# This is image *building*, not deployment. Deployment stays a manual `kubectl apply` against the
# demo box (see infrastructure/kubernetes/production/README.md); nothing here talks to any server,
# and this workflow deliberately does not reopen the sprint's decision to defer CI/CD.
#
# Why it exists at all: the demo box is x86_64 (Hetzner CX23) and the development laptop is arm64,
# so images built locally will not run there. GitHub's hosted runners are native x86, free for
# public repositories, and build without QEMU emulation — which is the difference between a
# five-module Maven build taking minutes and taking a large multiple of that under emulation.
#
# Trigger: manual only (`workflow_dispatch`). Chosen over `on: push` because deployment is manual
# anyway — a build that fires on every push would produce images nobody asked for and would make
# the mutable `latest` tag move under a box that is meant to be boringly stable. Publishing is an
# explicit act here, matching how the deploy itself works. Every run also pushes an immutable
# commit-SHA tag, which is what you want to pin in
# infrastructure/kubernetes/production/ghcr/kustomization.yaml once the first deploy is done.
#
# Run it from the Actions tab, or:
#   gh workflow run build-images.yml -f tag=latest
#
# Manual fallback, if this workflow is unavailable or not yet trusted — from the laptop, one
# service at a time (buildx cross-compiles via QEMU, so expect it to be slow):
#   echo "$GITHUB_TOKEN" | docker login ghcr.io -u <github-user> --password-stdin
#   docker buildx build --platform linux/amd64 --push \
#     -t ghcr.io/<owner>/kafka-portfolio-project/order-service:latest \
#     -f services/order-service/Dockerfile .
#   # ... same for inventory, payment, fulfillment, scenario; then the frontend, which needs the
#   # production base URLs baked in:
#   docker buildx build --platform linux/amd64 --push \
#     -t ghcr.io/<owner>/kafka-portfolio-project/frontend:latest \
#     --build-arg VITE_ORDER_SERVICE_URL=/svc/order \
#     --build-arg VITE_INVENTORY_SERVICE_URL=/svc/inventory \
#     --build-arg VITE_PAYMENT_SERVICE_URL=/svc/payment \
#     --build-arg VITE_FULFILLMENT_SERVICE_URL=/svc/fulfillment \
#     --build-arg VITE_SCENARIO_SERVICE_URL=/svc/scenario \
#     frontend/
# The published packages must be made public once (GHCR packages default to private) so k3s can
# pull them without an imagePullSecret.
name: Build images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mutable tag to publish alongside the commit SHA"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Don't let one service's failure cancel the other five — a partial publish is easier to
      # reason about when you can see which images did build.
      fail-fast: false
      matrix:
        include:
          # The five services build with the repo root as context: their Dockerfiles copy the
          # whole services/ tree because Maven's reactor requires every module in the root pom to
          # exist on disk, even with -pl restricting what actually compiles.
          - name: order-service
            file: services/order-service/Dockerfile
            context: .
            args: ""
          - name: inventory-service
            file: services/inventory-service/Dockerfile
            context: .
            args: ""
          - name: payment-service
            file: services/payment-service/Dockerfile
            context: .
            args: ""
          - name: fulfillment-service
            file: services/fulfillment-service/Dockerfile
            context: .
            args: ""
          - name: scenario-service
            file: services/scenario-service/Dockerfile
            context: .
            args: ""
          # The frontend is the only image with build args: Vite bakes the backend base URLs into
          # the bundle at build time. These are the ingress path prefixes from
          # infrastructure/kubernetes/production/common/ingress.yaml — relative, so every browser
          # request is same-origin and no hostname ends up in the bundle. A plain local
          # `docker build` with no args still bakes in http://localhost:808X, which is what the
          # Compose and kind flows need.
          - name: frontend
            file: frontend/Dockerfile
            context: frontend
            args: |
              VITE_ORDER_SERVICE_URL=/svc/order
              VITE_INVENTORY_SERVICE_URL=/svc/inventory
              VITE_PAYMENT_SERVICE_URL=/svc/payment
              VITE_FULFILLMENT_SERVICE_URL=/svc/fulfillment
              VITE_SCENARIO_SERVICE_URL=/svc/scenario
    steps:
      - uses: actions/checkout@v4

      # GHCR paths must be lowercase; GitHub owner/repo names need not be.
      - name: Resolve image name
        id: img
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The demo box is x86_64. The runner is too, so this is a native build.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:${{ inputs.tag }}
            ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
