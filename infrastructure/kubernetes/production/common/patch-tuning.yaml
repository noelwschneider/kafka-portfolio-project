apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-service
  namespace: orderfulfillment
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: scenario-service
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0"
            # Activates services/scenario-service/src/main/resources/application-production.yml:
            # W4's idle auto-reset (15 min) and T4's widened scenario timeouts. This is the only
            # place in the repo that turns that profile on, which is why the local kind and
            # Compose flows are unaffected by either.
            - name: SPRING_PROFILES_ACTIVE
              value: production
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: orderfulfillment
spec:
  template:
    spec:
      containers:
        - name: kafka
          env:
            # The apache/kafka image's kafka-server-start.sh sets -Xmx1G -Xms1G when KAFKA_HEAP_OPTS
            # is unset, ignoring the container limit. 512 MiB against the 1 GiB limit leaves real
            # room for the broker's off-heap page-cache use.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
          startupProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
