# CX23 tuning (T2/T3/T4 of docs/agent-reports/sprint-2/deployment-platform-revision.md §3).
#
# Everything here is specific to the 2-vCPU / 4 GB demo box and deliberately does NOT go into the
# base manifests: on an 8-core development machine these numbers would only make failures slower
# to surface. The one tuning change that IS a strict improvement everywhere — Kafka's readiness
# probe no longer spawning a JVM per check (T1) — lives in ../03-kafka.yaml instead.
#
# Three things are being fixed:
#
# T2 — explicit heap caps. Left to itself the JVM takes 25% of the container limit (160 MiB of the
#      640 MiB limit here) and Kafka takes a flat 1 GB regardless of its limit. Neither number is
#      chosen with any knowledge of this workload. MaxRAMPercentage=60 gives each service ~384 MiB
#      of heap and leaves ~256 MiB for metaspace, code cache, thread stacks and direct buffers,
#      which is the part that gets a container OOMKilled when people set the heap to the limit.
#      Kafka gets 512 MiB, which §3 records as ample for one broker with this project's topics.
#
# T3 — startup is the pressure point, not steady state. Five JVMs and a broker starting at once on
#      2 vCPUs is exactly the contention Phase 10 measured at 270-406% CPU on an 8-core machine. A
#      startupProbe is the right tool: while it is running, the liveness and readiness probes are
#      not evaluated at all, so a slow cold start cannot be read as a failure and cannot restart a
#      pod that is merely waiting for a CPU slice. It allows up to 5 minutes to come up, then hands
#      over to the normal probes — which keep their base semantics but with more headroom.
#
# T4 — scenario timeouts (scenario-service only) are Spring properties rather than probe settings;
#      they move via SPRING_PROFILES_ACTIVE=production and live in that service's
#      application-production.yml. The same env var also turns on W4's idle auto-reset.
#
# T5 — maxSurge: 0 on all five backend Deployments. Kubernetes' default rolling-update strategy
#      (maxSurge: 25%, maxUnavailable: 25%) starts the new pod before tearing down the old one, so
#      restarting a single-replica Deployment briefly runs old and new together. That is fine on a
#      box with headroom; it is not fine here. Sprint 2 added a per-service outbox-dispatcher
#      thread and retention-scheduler thread (ADR-006), and a same-night incident showed the
#      result: `kubectl rollout restart deployment` against all five backend Deployments at once
#      tried to briefly run ten JVMs' worth of memory on a 4 GB box with no swap, which pushed
#      memory to 100%, made the box thrash, and took the k3s API server itself unresponsive — too
#      overloaded to notice the new pods had failed readiness, so it never rolled back the old ones
#      either, and the deadlock did not self-resolve without a manual reboot.
#      `maxSurge: 0, maxUnavailable: 1` (the default for a single-replica Deployment) tears the old
#      pod down before starting the new one, so the fleet's memory footprint never exceeds its
#      steady-state size during a deploy. The cost is a few seconds of per-service unavailability
#      while the new pod starts, which is acceptable for this demo. See
#      docs/adr/ADR-011-sequential-production-rollouts-to-avoid-memory-exhaustion.md. This is a
#      Deployment strategy, not a resource number, so it is unconditionally correct for the demo
#      box regardless of future capacity changes — it does not belong in the same conditional as
#      the heap caps and probe timing above, but lives alongside them here per this directory's
#      existing convention of one file for CX23-only Deployment patches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orderfulfillment
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: order-service
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
