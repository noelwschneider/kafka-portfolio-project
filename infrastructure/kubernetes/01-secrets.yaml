# Postgres credentials as a real Secret + secretKeyRef, not inline plaintext in a Deployment spec
# or ConfigMap. These particular dev credentials (orderfulfillment/orderfulfillment, the same
# values docker-compose.yml already uses) aren't actually sensitive, but the point of this phase
# is demonstrating the primitive correctly.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: orderfulfillment
type: Opaque
stringData:
  POSTGRES_DB: orderfulfillment
  POSTGRES_USER: orderfulfillment
  POSTGRES_PASSWORD: orderfulfillment
