# Formalizes the manual `kubectl scale deployment/inventory-service --replicas=N` story that
# docs/agent-reports/sprint-1/phase-10-scaling-demo.md measured by hand into an actual autoscaler.
# See docs/architecture-diagram.md's "Scaling" section for the narrative this closes out, and
# docs/agent-reports/sprint-2/hpa-scaling-demo.md for the real scale-up/scale-down evidence this
# manifest was verified against on the Hetzner dev box.
#
# Why Inventory Service and not another service: it's the consumer Scenario 8 ("High-Volume
# Batch", docs/scenarios.md) is specifically written to stress — it consumes every OrderCreated
# off `orders.events` and does a reservation write per order — and it's the exact service Phase 10
# already scaled by hand and measured (1 vs 2 replicas: consumer lag and throughput both moved).
# This HPA targets CPU because that's what visibly saturates first under that scenario's write
# load, not I/O wait or memory.
#
# Why maxReplicas is 3, not higher: `orders.events` has a fixed 3-partition count (see
# docs/db-ownership.md / docs/events/event-catalog.md's partition counts), and a Kafka consumer
# group can never usefully have more running consumers than partitions — a 4th replica would sit
# idle with no partition assigned. 3 is the actual ceiling of "more replicas helps," not an
# arbitrary cap.
#
# Requires metrics-server (11-metrics-server.yaml, kind only) or an equivalent
# `metrics.k8s.io` provider — the HPA controller has nothing to read CPU from otherwise. On the
# production overlay this relies on k3s's own bundled metrics-server instead (see that file's
# header comment for why it isn't applied there).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service
  namespace: orderfulfillment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Against the 150m CPU request in 05-inventory-service.yaml: scale up once average
          # usage across replicas passes ~97m. Deliberately below 100% so the HPA reacts before
          # the container is fully CPU-starved, not after.
          averageUtilization: 65
  behavior:
    scaleDown:
      # Default HPA behavior scales down almost immediately once utilization drops, which reads as
      # flappy in a demo (add a pod, drop it 30s later, add it back). A 2-minute stabilization
      # window means the scale-down decision looks at the max recommendation over the last 2
      # minutes, so a brief dip mid-burst doesn't undo a scale-up that's still needed.
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # Keep the default fast-react scale-up policy (0s stabilization) — the whole point of this
      # demo is watching pods actually get added while a burst is still draining.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
