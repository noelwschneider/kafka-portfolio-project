# metrics-server, needed to feed the CPU-based HorizontalPodAutoscaler in
# 10-inventory-service-hpa.yaml. The HPA controller reads pod CPU/memory from the
# `metrics.k8s.io` aggregated API, which nothing in this cluster serves until this is applied —
# it is not part of "vanilla" Kubernetes the way readiness/liveness probes are.
#
# This is the mostly-unmodified upstream manifest (v0.9.0,
# https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml),
# not project-authored content. **The one change from upstream is the added
# `--kubelet-insecure-tls` arg on the Deployment below** — `kind` (and, per Phase 8/10, this
# project's dev-box flow) runs kubelets with self-signed serving certs that metrics-server can't
# verify against a real CA, and without this flag every kubelet scrape fails and `kubectl top` /
# the HPA both see no metrics at all. This is a standard, widely-documented `kind`/local-cluster
# workaround, not a production-grade posture — see the note below.
#
# Reused vs. new infrastructure (Agent Rule 11): the project already runs Prometheus, but only
# under Docker Compose, scraping each service's own `/actuator/prometheus` (see
# infrastructure/observability/prometheus.yml) — that setup isn't deployed into any Kubernetes
# cluster and Kubernetes' own HPA v2 API reads container CPU/memory from `metrics.k8s.io`, which
# only metrics-server (or a Prometheus Adapter shim, meaningfully heavier for the same result)
# serves. So this is additive cluster infrastructure, not a duplicate of the existing Prometheus
# setup, and it doesn't replace it — Prometheus still owns the app-level dashboards.
#
# NOT applied to the production overlay (see infrastructure/kubernetes/production/): k3s (what the
# public demo box runs, per ADR-010) bundles its own metrics-server by default as a `kube-system`
# addon with real-enough TLS, so applying this file there would install a second, conflicting
# metrics-server. This file is only for `kind` (local dev machine and the Hetzner dev box's `kind`
# cluster, per docs/agent-reports/sprint-2/hetzner-dev-box-setup.md) — applying
# `kubectl apply -f infrastructure/kubernetes/` picks it up there automatically, same as every
# other file in this directory.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: system:aggregated-metrics-reader
rules:
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/metrics
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  ports:
    - appProtocol: https
      name: https
      port: 443
      protocol: TCP
      targetPort: https
  selector:
    k8s-app: metrics-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      containers:
        - args:
            - --cert-dir=/tmp
            - --secure-port=10250
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
            # kind-only workaround, see header comment: kubelet serving certs in kind aren't
            # signed by a CA metrics-server trusts, so scrapes fail without this.
            - --kubelet-insecure-tls
          image: registry.k8s.io/metrics-server/metrics-server:v0.9.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 10
          name: metrics-server
          ports:
            - containerPort: 10250
              name: https
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp
              name: tmp-dir
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      serviceAccountName: metrics-server
      volumes:
        - emptyDir: {}
          name: tmp-dir
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  labels:
    k8s-app: metrics-server
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: metrics-server
    namespace: kube-system
  version: v1beta1
  versionPriority: 100
