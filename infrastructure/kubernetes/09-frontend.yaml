# Frontend is a browser-side SPA (Vite build) that calls backend URLs directly from fetch(),
# baked in at build time via VITE_*_SERVICE_URL (frontend/.env.example). No rebuild needed here:
# the existing Phase 7 image (built with the default http://localhost:8081..8085 values) works
# unmodified because kind-config.yaml maps NodePorts back onto those exact host ports.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: orderfulfillment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: orderfulfillment
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
  type: NodePort
