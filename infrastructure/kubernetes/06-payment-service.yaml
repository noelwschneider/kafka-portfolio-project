apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: orderfulfillment
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderfulfillment
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # See 04-order-service.yaml's comment: no Kafka health indicator is registered in this app, so
  # this wires the "db" indicator (the one dependency check that does exist) into the readiness
  # group so readiness genuinely reacts to a dependency outage, per ADR-007.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: orderfulfillment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: orderfulfillment
spec:
  selector:
    app: payment-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
  type: NodePort
