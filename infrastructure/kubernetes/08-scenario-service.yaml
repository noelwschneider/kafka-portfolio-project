# Scenario Service is the orchestrator that drives the other 4 services over HTTP for the demo
# scenarios (docs/planning/frontend-design.md's scenario list) — its ConfigMap carries their
# in-cluster Service DNS names, the K8s equivalent of docker-compose.yml's
# ORDER_SERVICE_URL=http://order-service:8081 etc (same short names, since everything lives in
# the same `orderfulfillment` namespace).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-service-config
  namespace: orderfulfillment
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderfulfillment
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # See 04-order-service.yaml's comment: no Kafka health indicator is registered in this app, so
  # this wires the "db" indicator (the one dependency check that does exist) into the readiness
  # group so readiness genuinely reacts to a dependency outage, per ADR-007.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  ORDER_SERVICE_URL: http://order-service:8081
  INVENTORY_SERVICE_URL: http://inventory-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  FULFILLMENT_SERVICE_URL: http://fulfillment-service:8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-service
  namespace: orderfulfillment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenario-service
  template:
    metadata:
      labels:
        app: scenario-service
    spec:
      containers:
        - name: scenario-service
          image: scenario-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: scenario-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-service
  namespace: orderfulfillment
spec:
  selector:
    app: scenario-service
  ports:
    - port: 8085
      targetPort: 8085
      nodePort: 30085
  type: NodePort
