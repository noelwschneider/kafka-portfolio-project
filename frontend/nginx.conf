# Replaces the stock nginx:alpine default server block (see Dockerfile). App.tsx uses
# BrowserRouter (client-side routing), so any path nginx doesn't recognize as a real file must fall
# back to index.html rather than 404 — otherwise a deep link or a page refresh on a client route
# (e.g. /orders/{id}, /scenario-runs/{id}) breaks. Invisible locally because the Vite dev server
# does its own fallback; only visible once this image serves the built assets directly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript
        application/xml image/svg+xml;

    # Vite content-hashes everything under /assets, so it's safe (and correct) to cache those
    # files for a long time — a new build always ships new hashed filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, or a deployed rebuild won't be picked up by a
    # browser that already has an old copy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
