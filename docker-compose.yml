services:
  postgres:
    image: postgres:16-alpine
    container_name: orderfulfillment-postgres
    environment:
      POSTGRES_DB: orderfulfillment
      POSTGRES_USER: orderfulfillment
      POSTGRES_PASSWORD: orderfulfillment
    ports:
      - "5432:5432"
    volumes:
      - orderfulfillment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderfulfillment -d orderfulfillment"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pinned per docs/planning/project-overview.md's Pinned Technology Decisions table: the
  # apache/kafka image, KRaft mode (no ZooKeeper). Single-node broker+controller, for local
  # dev/demo use only — not a production topology.
  kafka:
    image: apache/kafka:4.0.0
    container_name: orderfulfillment-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Phase 7: dual listeners. HOST is what host-side tools (local `mvn spring-boot:run`,
      # Testcontainers-based integration tests, `kafka-console-consumer` from your laptop) connect
      # to via localhost:9092, exactly as before this phase. INTERNAL is what containers on the
      # compose network (the 5 backend services) use via kafka:29092 — a name that only resolves
      # inside the compose network, which is the point: a container that connects on INTERNAL gets
      # handed back the INTERNAL advertised address (kafka:29092) for subsequent produce/consume,
      # instead of "localhost" resolving to itself. Without this split, a container-side client
      # would connect fine on its first request (to the bootstrap address) and then fail as soon as
      # it tried to actually produce/consume, because the broker's metadata response would tell it
      # to reconnect to "localhost" — itself, not the broker.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "orderfulfillment-lab-kraft-cluster-1"
    healthcheck:
      # Broker API versions round-trip proves the broker is actually accepting client connections
      # on the HOST listener, not just that the process is up (KRaft startup has a window where the
      # process is running but not yet serving). Same image ships the CLI, so no extra tooling.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: orderfulfillment-order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderfulfillment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: orderfulfillment-inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderfulfillment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: orderfulfillment-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderfulfillment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  fulfillment-service:
    build:
      context: .
      dockerfile: services/fulfillment-service/Dockerfile
    container_name: orderfulfillment-fulfillment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderfulfillment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  scenario-service:
    build:
      context: .
      dockerfile: services/scenario-service/Dockerfile
    container_name: orderfulfillment-scenario-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderfulfillment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Server-to-server calls (this service is the scenario orchestrator that drives the others
      # over HTTP), so these use the compose service names, unlike the frontend's browser-side URLs.
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:8084
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      fulfillment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orderfulfillment-frontend
    ports:
      - "5173:80"
    depends_on:
      scenario-service:
        condition: service_healthy

  # Phase 9 Observability stretch goal (docs/planning/high-level-design.md's Observability
  # section lists this as the "Stronger later version" — optional, added here because there was
  # comfortable room left after the required correlation-id/metrics work). Scrapes each backend
  # service's /actuator/prometheus (micrometer-registry-prometheus, added this phase).
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: orderfulfillment-prometheus
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      fulfillment-service:
        condition: service_healthy
      scenario-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: orderfulfillment-grafana
    environment:
      # Dev-only credentials, same pattern as Postgres's trivial dev password elsewhere in this
      # file — not protecting anything sensitive, just standing up the primitive correctly.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  orderfulfillment-postgres-data:
