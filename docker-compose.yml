services:
  postgres:
    image: postgres:16-alpine
    container_name: orderfulfillment-postgres
    environment:
      POSTGRES_DB: orderfulfillment
      POSTGRES_USER: orderfulfillment
      POSTGRES_PASSWORD: orderfulfillment
    ports:
      - "5432:5432"
    volumes:
      - orderfulfillment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderfulfillment -d orderfulfillment"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pinned per docs/planning/project-overview.md's Pinned Technology Decisions table: the
  # apache/kafka image, KRaft mode (no ZooKeeper). Single-node broker+controller, for local
  # dev/demo use only — not a production topology.
  kafka:
    image: apache/kafka:4.0.0
    container_name: orderfulfillment-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "orderfulfillment-lab-kraft-cluster-1"

volumes:
  orderfulfillment-postgres-data:
