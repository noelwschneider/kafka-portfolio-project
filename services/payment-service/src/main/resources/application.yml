spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderfulfillment
    username: orderfulfillment
    password: orderfulfillment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: payment_service
    # Phase 3 simplification: see order-service/src/main/resources/application.yml's comment and
    # docs/agent-reports/phase-3-boundary.md.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

orderfulfillment:
  reliability:
    processed-events-table: payment_service.processed_events

server:
  port: 8083

logging:
  level:
    com.orderfulfillment: INFO
