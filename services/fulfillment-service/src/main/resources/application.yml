spring:
  application:
    name: fulfillment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderfulfillment
    username: orderfulfillment
    password: orderfulfillment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: fulfillment_service
    # Phase 3 simplification: see order-service/src/main/resources/application.yml's comment and
    # docs/agent-reports/phase-3-boundary.md.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: fulfillment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

orderfulfillment:
  reliability:
    # This service's own copy of the idempotency ledger, in its own schema (docs/db-ownership.md §2
    # — processed_events is per-service, never shared, because the dedup insert must commit in the
    # same local transaction as the business change). Created by V2__processed_events.sql.
    processed-events-table: fulfillment_service.processed_events
  outbox:
    # Sprint 2's transactional outbox (ADR-006), extended to Fulfillment Service. Same defaults as
    # Order Service's copy — see that service's application.yml for the full rationale of each value.
    poll-interval-ms: 50
    batch-size: 100
    send-timeout-ms: 10000
    fail-after-ms: 300000
  retention:
    # Sprint 2: purges old processed_events rows, flagged as growing without bound in ADR-005.
    # 7 days matches Kafka's own default topic retention (log.retention.hours=168) — see
    # order-service/src/main/resources/application.yml for the full rationale.
    processed-events-days: 7
    check-interval-ms: 86400000

app:
  cors:
    # Single source of truth for allowed browser origins (WebConfig + the actuator CORS block
    # below). Override with APP_CORS_ALLOWED_ORIGIN_PATTERNS; never `*`, never with credentials.
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

management:
  endpoints:
    web:
      exposure:
        # Phase 9 Observability: metrics added to the previously health-only exposure
        # (docs/planning/high-level-design.md's Observability section requires
        # health/metrics/info).
        include: health,metrics,prometheus
      # Actuator's WebMvcEndpointHandlerMapping bypasses WebConfig's regular CORS mapping — without
      # this, browser calls to /actuator/health are blocked even though curl works fine.
      cors:
        allowed-origin-patterns: "${app.cors.allowed-origin-patterns}"
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8084

logging:
  level:
    com.orderfulfillment: INFO
  # Phase 9 Observability: Spring Boot 4.1's native structured logging (no extra dependency —
  # see docs/adr/ADR-008-native-structured-logging.md). ECS maps spring.application.name to a
  # top-level service.name field and puts SLF4J MDC entries (CorrelationIdFilter/
  # CorrelationIdHolder put correlationId there for every HTTP request and every
  # @KafkaListener thread) under labels.*, so `docker compose logs <service> | grep
  # <correlation-id>` finds a workflow's hops across all 5 services.
  structured:
    format:
      console: ecs
