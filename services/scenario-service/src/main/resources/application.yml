spring:
  application:
    name: scenario-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderfulfillment
    username: orderfulfillment
    password: orderfulfillment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: scenario_service
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # Its own consumer group, deliberately never named "order-service"/"inventory-service"/etc, so
      # this projection never competes for partitions or offsets with a real domain consumer group
      # (see the class Javadoc on EventProjectionConsumer).
      group-id: scenario-service-projection
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

orderfulfillment:
  services:
    order-service: ${ORDER_SERVICE_URL:http://localhost:8081}
    inventory-service: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    payment-service: ${PAYMENT_SERVICE_URL:http://localhost:8083}
    fulfillment-service: ${FULFILLMENT_SERVICE_URL:http://localhost:8084}
  scenario:
    # How long Scenario 5 (consumer-outage) leaves the Inventory Service listener paused before
    # resuming it, long enough for the backlog to be visibly durable in the UI.
    consumer-outage-pause-ms: 4000
    # Poll interval while a scenario waits on an order's status via GET /api/orders/{id}, used
    # because Order Service's own SSE stream (GET /api/orders/stream) was not confirmed ready when
    # this service was built — see the report's follow-up note.
    order-poll-interval-ms: 250
    order-poll-timeout-ms: 20000
    # Phase 10 Scaling Demo (Scenario 8 — High-Volume Batch). Burst size stays under SKU-003's
    # seeded stock of 100 so a run never needs an artificial restock; tuned against the real
    # replica-scaling measurements in docs/agent-reports/phase-10-scaling-demo.md.
    high-volume-burst-size: 60
    # Client-side POST /api/orders concurrency for the burst — deliberately well above the
    # broker's 3-partition ceiling (KafkaTopicConfig), since this bounds how fast this service can
    # *submit* the burst, not how fast Inventory Service's consumer group can *drain* it.
    high-volume-submission-concurrency: 20
    high-volume-lag-poll-interval-ms: 300
    high-volume-lag-poll-timeout-ms: 60000
    # Longer than order-poll-timeout-ms (used by every other scenario watching a single order):
    # dozens of orders watched concurrently against one Order Service pod can each legitimately
    # need longer than 20s before their SSE connection/poll gets a CPU slice under this burst's
    # load, even though the order itself reaches FULFILLED promptly (see OrderStatusWatcher's
    # per-call timeout overload).
    high-volume-order-watch-timeout-ms: 60000
  idle-reset:
    # W4 (docs/agent-reports/sprint-2/deployment-code-changes-briefing.md): scheduled auto-reset for
    # a demo box left stuck after a scenario dies mid-run. Off by default — a reset firing during
    # local development would be confusing — see application-production.yml for the profile that
    # turns it on. IdleResetScheduler is not even created as a bean unless this is true.
    enabled: false
    idle-period-ms: 900000 # 15 minutes — see the briefing's "Open questions" (now closed).
    check-interval-ms: 60000

app:
  cors:
    # Single source of truth for allowed browser origins (WebConfig + the actuator CORS block
    # below). Override with APP_CORS_ALLOWED_ORIGIN_PATTERNS; never `*`, never with credentials.
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

management:
  endpoints:
    web:
      exposure:
        # Phase 9 Observability: metrics added to the previously health-only exposure
        # (docs/planning/high-level-design.md's Observability section requires
        # health/metrics/info).
        include: health,metrics,prometheus
      # Actuator's WebMvcEndpointHandlerMapping bypasses WebConfig's regular CORS mapping — without
      # this, browser calls to /actuator/health are blocked even though curl works fine.
      cors:
        allowed-origin-patterns: "${app.cors.allowed-origin-patterns}"
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true
      # Frontend Overview page reads the kafka/db components from this response (Sprint 4 #16) —
      # without this, /actuator/health returns only the top-level status, no components map at all.
      show-components: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8085

logging:
  level:
    com.orderfulfillment: INFO
  # Phase 9 Observability: Spring Boot 4.1's native structured logging (no extra dependency —
  # see docs/adr/ADR-008-native-structured-logging.md). ECS maps spring.application.name to a
  # top-level service.name field and puts SLF4J MDC entries (CorrelationIdFilter/
  # CorrelationIdHolder put correlationId there for every HTTP request and every
  # @KafkaListener thread) under labels.*, so `docker compose logs <service> | grep
  # <correlation-id>` finds a workflow's hops across all 5 services.
  structured:
    format:
      console: ecs
