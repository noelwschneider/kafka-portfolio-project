spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderfulfillment
    username: orderfulfillment
    password: orderfulfillment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No default_schema: the entity's @Table(schema="order_service") is explicit, matching
    # docs/db-ownership.md even though this JVM now only ever touches its own schema.
  flyway:
    schemas: order_service
    # Phase 3 simplification: Spring Boot's ordinary built-in Flyway auto-configuration is enough
    # now that each service's JVM only ever migrates its own schema — the Phase 1/2 multi-schema
    # SchemaMigrationRunner existed only because one JVM drove four schemas at once. See
    # docs/agent-reports/phase-3-boundary.md.
  jackson:
    deserialization:
      fail-on-unknown-properties: false # envelope versioning rule (event-catalog.md §5): consumers must ignore unknown fields
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service # every @KafkaListener below overrides this with its own service-scoped group id
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

orderfulfillment:
  reliability:
    # This service's own copy of the idempotency ledger, in its own schema (docs/db-ownership.md §2
    # — processed_events is per-service, never shared, because the dedup insert must commit in the
    # same local transaction as the business change). Created by V2__processed_events.sql.
    processed-events-table: order_service.processed_events
  outbox:
    # Phase 6's transactional outbox (ADR-006), Order Service only. The poll interval is the
    # publication latency this pattern costs: ADR-006 budgets "tens of milliseconds if the publisher
    # polls tightly", and 50ms is inside that without a notify-on-commit hook.
    poll-interval-ms: 50
    # Rows per tick. Sends are sequential and acknowledged one at a time (ordering), so this bounds
    # how long one transaction can hold its FOR UPDATE lock on the pending rows.
    batch-size: 100
    # How long to block on one broker acknowledgement before treating the send as failed.
    send-timeout-ms: 10000
    # Retry budget, expressed as age because the frozen schema has no retry-count column: a row that
    # cannot be published within 5 minutes of being written is marked FAILED (and logged at ERROR)
    # rather than retried forever, so a permanently unpublishable row cannot block the queue.
    fail-after-ms: 300000

management:
  endpoints:
    web:
      exposure:
        # Narrowly scoped to health only (docs/planning/high-level-design.md §16) — metrics/info are
        # Phase 9 Observability's concern, not this task's.
        include: health
      # Actuator endpoints are served via a separate WebMvcEndpointHandlerMapping that does NOT go
      # through WebConfig's WebMvcConfigurer#addCorsMappings (that only covers regular
      # @RestController endpoints) — so the frontend's browser-side calls to /actuator/health were
      # silently blocked by CORS until this was added, even though curl (which doesn't enforce CORS)
      # showed the endpoint working fine. Found via live browser verification, not curl.
      cors:
        allowed-origin-patterns: "http://localhost:*"
        allowed-methods: GET
  endpoint:
    health:
      # Adds the liveness/readiness endpoint groups Kubernetes probes actually target
      # (/actuator/health/liveness, /actuator/health/readiness) per §16.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8081

logging:
  level:
    com.orderfulfillment: INFO
