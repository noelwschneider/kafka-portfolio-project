spring:
  application:
    name: monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/orderfulfillment
    username: orderfulfillment
    password: orderfulfillment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No default_schema: each entity's @Table(schema=...) is explicit, matching
    # docs/db-ownership.md's one-schema-per-service boundary even inside one JPA persistence unit.
  flyway:
    enabled: false # multi-schema migration is driven manually by SchemaMigrationRunner (see common package)

server:
  port: 8080

logging:
  level:
    com.orderfulfillment: INFO
